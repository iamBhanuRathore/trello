services:
  postgres:
    image: postgres:16-alpine
    container_name: boardly_postgres
    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly_dev
      POSTGRES_DB: boardly_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardly -d boardly_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: boardly_postgres_test
    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly_test
      POSTGRES_DB: boardly_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardly -d boardly_test']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boardly_redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
