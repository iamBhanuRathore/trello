services:
  postgres:
    image: postgres:16-alpine
    container_name: boardly_postgres
    environment:
      # Override in production: POSTGRES_PASSWORD=... docker compose up
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardly_dev}
      POSTGRES_DB: boardly_dev
    ports:
      # Loopback-only: dev DBs must never listen on LAN interfaces.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardly -d boardly_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: boardly_postgres_test
    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-boardly_test}
      POSTGRES_DB: boardly_test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardly -d boardly_test']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boardly_redis
    ports:
      # Loopback-only; no AUTH in local dev (matches default REDIS_URL).
      # Production uses managed Redis (Upstash) with TLS + token auth instead.
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # 5.5 media virus-scan sidecar (fail-closed). The backend streams staged
  # bytes to clamd INSTREAM (see modules/media/scan.ts); nothing is servable
  # until clean. Disabled by default in dev (SCAN_MODE=disabled → skipped);
  # production sets SCAN_MODE=enabled and refuses to boot reads otherwise.
  # StreamMaxLength sits above the 25 MB upload cap so the app limit trips
  # first and the sidecar never truncates a scan.
  clamav:
    image: clamav/clamav:stable
    container_name: boardly_clamav
    ports:
      - '127.0.0.1:3310:3310'
    environment:
      CLAMAV_NO_FRESHCLAMD: 'false'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - scan

volumes:
  postgres_data:
  redis_data:
  clamav_data:
