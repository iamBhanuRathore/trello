apiVersion: v1
kind: ConfigMap
metadata:
  name: boardly-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    app: boardly-backend
    environment: {{ .Values.environment }}
data:
  PORT: {{ .Values.config.PORT | quote }}
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  DASHBOARD_URL: {{ .Values.config.DASHBOARD_URL | quote }}
  API_URL: {{ .Values.config.API_URL | quote }}
  APP_URL: {{ .Values.config.APP_URL | quote }}
  REDIS_CHANNEL: {{ .Values.config.REDIS_CHANNEL | quote }}
  PRESENCE_TTL_SECONDS: {{ .Values.config.PRESENCE_TTL_SECONDS | quote }}
