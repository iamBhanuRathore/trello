name: Build and Deploy Boardly Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

# contents:write is required — this workflow pushes the updated Helm tag back
# to main. Self-trigger loops are contained by the bot-actor guard + [skip ci].
permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/boardly-backend
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm values with new image tag
        # Guard against self-trigger loops: only push from human commits, and the
        # [skip ci] trailer keeps the resulting push from retriggering this workflow.
        if: github.actor != 'github-actions[bot]'
        run: |
          IMAGE_TAG="${{ github.sha }}"
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" infra/helm/boardly-backend/values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/boardly-backend/values.yaml
          git commit -m "chore(deploy): update backend image tag to ${IMAGE_TAG} [skip ci]" || echo "No changes to commit"
          git push origin main
