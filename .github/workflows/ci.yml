name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardly
          POSTGRES_PASSWORD: boardly_test
          POSTGRES_DB: boardly_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U boardly -d boardly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://boardly:boardly_test@localhost:5433/boardly_test
      DATABASE_TEST_URL: postgresql://boardly:boardly_test@localhost:5433/boardly_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-at-least-32-chars
      NODE_ENV: test
      API_URL: http://localhost:3001
      DASHBOARD_URL: http://localhost:5173,http://localhost:5174
      # Release identity for error monitoring. Vite embeds only VITE_* vars
      # present in the build environment (the .env* files turbo hashes do not
      # cover CI-injected values), so both names are set from the same sha.
      # These also belong in turbo's build.env so the cache key reflects them.
      GIT_SHA: ${{ github.sha }}
      VITE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck across all workspaces
        run: bun run typecheck

      - name: Lint across all workspaces
        run: bun run lint

      - name: Database CLI target-resolution tests
        # db.sh can drop a schema. This asserts it refuses a non-local
        # DATABASE_URL, which is the defect that put migration 0040 on the
        # shared remote database.
        run: ./scripts/db.sh.test.sh

      - name: Dev launcher infra-mode tests
        # dev.sh used to require a Docker daemon unconditionally, so a stack
        # pointed at managed Postgres/Redis could not be launched at all. This
        # asserts INFRA_MODE=remote never invokes docker and never migrates
        # without ALLOW_REMOTE_DB=1.
        run: ./scripts/dev.sh.test.sh

      - name: Documentation-gate tests
        # check-docs.sh is itself a gate, so it needs the same treatment: it had
        # an ordering bug that made it unsatisfiable by a `docs:` commit.
        run: ./scripts/check-docs.sh.test.sh

      - name: Build monorepo packages
        run: bun run build

      - name: Run PostgreSQL schema migrations
        run: bun run --cwd apps/backend db:migrate

      - name: Seed default roles and plans
        run: bun run --cwd apps/backend db:seed

      - name: Run unit & integration test suites
        run: bun run test

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardly
          POSTGRES_PASSWORD: boardly_test
          POSTGRES_DB: boardly_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U boardly -d boardly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://boardly:boardly_test@localhost:5433/boardly_test
      DATABASE_TEST_URL: postgresql://boardly:boardly_test@localhost:5433/boardly_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-at-least-32-chars
      NODE_ENV: test
      API_URL: http://localhost:3001
      DASHBOARD_URL: http://localhost:5173,http://localhost:5174
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:3001/v1
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        # `bunx --cwd DIR pkg` does NOT change directory: --cwd is not a bunx
        # flag, so bunx read "apps/dashboard" as a package name and failed with
        # `GET https://api.github.com/repos/apps/dashboard/tarball/ - 404`.
        # This has been failing in CI since the E2E job was added.
        run: cd apps/dashboard && bunx playwright install --with-deps chromium

      - name: Migrate + seed (base + Acme demo org for personas)
        run: |
          bun run --cwd apps/backend db:migrate
          bun run --cwd apps/backend db:seed
          bun run --cwd apps/backend db:seed:org

      - name: Start backend + dashboard
        run: |
          (bun run --cwd apps/backend dev &)
          (bun run --cwd apps/dashboard dev -- --port 5173 --strictPort &)
          for i in $(seq 1 24); do
            curl -sf http://localhost:3001/v1/calendar/google/status >/dev/null 2>&1 && curl -sf http://localhost:5173 >/dev/null 2>&1 && break
            sleep 5
          done

      - name: Run Playwright smoke suite
        run: bun run --cwd apps/dashboard test:e2e:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
